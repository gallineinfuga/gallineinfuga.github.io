name: Menu contract checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate menu and visual contract
        run: node scripts/check-visual-contract.mjs
